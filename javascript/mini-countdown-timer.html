<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown Timer | Practical Programs</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.demo-form { display:grid; gap:14px; margin-top:18px; }
.demo-form input, .demo-form textarea, .demo-form select { width:100%; padding:10px; margin-top:6px; box-sizing:border-box; }
.demo-form button, button { padding:10px 16px; cursor:pointer; }
.output-box { margin-top:18px; padding:14px; white-space:pre-wrap; }
table { width:100%; border-collapse:collapse; margin-top:15px; }
th, td { border:1px solid #ccc; padding:10px; text-align:left; }
img.demo-img { max-width:100%; border-radius:10px; }
.box { padding:15px; border:1px solid #ddd; margin:10px 0; border-radius:8px; }
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="../index.html"><span class="brand-dot">JR</span>Jayadeep</a>
  <nav class="crumbs">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
  </nav>
</header>
<main>
  <h1 class="page-title">Countdown Timer</h1>
  <p class="subtitle">Counts down from a number of seconds.</p>
  <div class="program-box">

<input id="seconds" type="number" value="60">
<button onclick="startCountdown()">Start</button>
<div id="out" class="output-box"></div>

  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>

let countdown;
function startCountdown() {
  clearInterval(countdown);
  let seconds = Number(document.getElementById("seconds").value);
  document.getElementById("out").textContent = seconds;
  countdown = setInterval(() => {
    seconds--;
    document.getElementById("out").textContent = seconds;
    if (seconds <= 0) { clearInterval(countdown); document.getElementById("out").textContent = "Time's up!"; }
  }, 1000);
}

</script>
</body>
</html>
