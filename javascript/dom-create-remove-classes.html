<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Create and Remove CSS Classes Dynamically | Practical Programs</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.demo-form { display:grid; gap:14px; margin-top:18px; }
.demo-form input, .demo-form textarea, .demo-form select { width:100%; padding:10px; margin-top:6px; box-sizing:border-box; }
.demo-form button, button { padding:10px 16px; cursor:pointer; }
.output-box { margin-top:18px; padding:14px; white-space:pre-wrap; }
table { width:100%; border-collapse:collapse; margin-top:15px; }
th, td { border:1px solid #ccc; padding:10px; text-align:left; }
img.demo-img { max-width:100%; border-radius:10px; }
.box { padding:15px; border:1px solid #ddd; margin:10px 0; border-radius:8px; }
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="../index.html"><span class="brand-dot">JR</span>Jayadeep</a>
  <nav class="crumbs">
    <a href="../index.html">Home</a>

  </nav>
</header>
<main>
  <h1 class="page-title">Create and Remove CSS Classes Dynamically</h1>
  <p class="subtitle">Adds and removes CSS classes using classList.</p>
  <div class="program-box">

<style>
.highlight { background:#fff3a3; padding:15px; border-radius:8px; }
</style>
<p id="classBox" class="box">CSS class will be added or removed.</p>
<button onclick="addClass()">Add Class</button>
<button onclick="removeClass()">Remove Class</button>

  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>

function addClass() {
  document.getElementById("classBox").classList.add("highlight");
}
function removeClass() {
  document.getElementById("classBox").classList.remove("highlight");
}

</script>
</body>
</html>
