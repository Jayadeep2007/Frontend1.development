<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Application Using localStorage | Practical Programs</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.demo-form { display:grid; gap:14px; margin-top:18px; }
.demo-form input, .demo-form textarea, .demo-form select { width:100%; padding:10px; margin-top:6px; box-sizing:border-box; }
.demo-form button, button { padding:10px 16px; cursor:pointer; }
.output-box { margin-top:18px; padding:14px; white-space:pre-wrap; }
table { width:100%; border-collapse:collapse; margin-top:15px; }
th, td { border:1px solid #ccc; padding:10px; text-align:left; }
img.demo-img { max-width:100%; border-radius:10px; }
.box { padding:15px; border:1px solid #ddd; margin:10px 0; border-radius:8px; }
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="../index.html"><span class="brand-dot">JR</span>Jayadeep</a>
  <nav class="crumbs">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
  </nav>
</header>
<main>
  <h1 class="page-title">Notes Application Using localStorage</h1>
  <p class="subtitle">Saves notes in localStorage.</p>
  <div class="program-box">

<textarea id="note" rows="7" placeholder="Write a note"></textarea>
<br><button onclick="saveNote()">Save Note</button>
<button onclick="clearNote()">Clear</button>
<div id="out" class="output-box"></div>

  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>

function saveNote() {
  localStorage.setItem("myNote", document.getElementById("note").value);
  showNote();
}
function clearNote() {
  localStorage.removeItem("myNote");
  document.getElementById("note").value = "";
  showNote();
}
function showNote() {
  document.getElementById("out").textContent = localStorage.getItem("myNote") || "No saved note.";
}
document.getElementById("note").value = localStorage.getItem("myNote") || "";
showNote();

</script>
</body>
</html>
