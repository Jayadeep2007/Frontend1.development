<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List | Practical Programs</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.demo-form { display:grid; gap:14px; margin-top:18px; }
.demo-form input, .demo-form textarea, .demo-form select { width:100%; padding:10px; margin-top:6px; box-sizing:border-box; }
.demo-form button, button { padding:10px 16px; cursor:pointer; }
.output-box { margin-top:18px; padding:14px; white-space:pre-wrap; }
table { width:100%; border-collapse:collapse; margin-top:15px; }
th, td { border:1px solid #ccc; padding:10px; text-align:left; }
img.demo-img { max-width:100%; border-radius:10px; }
.box { padding:15px; border:1px solid #ddd; margin:10px 0; border-radius:8px; }
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="../index.html"><span class="brand-dot">JR</span>Jayadeep</a>
  <nav class="crumbs">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
  </nav>
</header>
<main>
  <h1 class="page-title">To-Do List</h1>
  <p class="subtitle">Adds and removes tasks from a simple list.</p>
  <div class="program-box">

<input id="task" placeholder="Enter a task">
<button onclick="addTask()">Add</button>
<ul id="tasks"></ul>

  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>

function addTask() {
  const text = document.getElementById("task").value.trim();
  if (!text) return;
  const li = document.createElement("li");
  li.textContent = text + " ";
  const button = document.createElement("button");
  button.textContent = "Delete";
  button.onclick = () => li.remove();
  li.appendChild(button);
  document.getElementById("tasks").appendChild(li);
  document.getElementById("task").value = "";
}

</script>
</body>
</html>
