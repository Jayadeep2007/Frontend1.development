<main>
  <h1 class="page-title">Digital Clock</h1>
  <p class="subtitle">Displays the current time.</p>
  <div class="program-box">

<div id="clock" class="box" style="font-size:40px;text-align:center;"></div>

  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>

function updateClock() {
  document.getElementById("clock").textContent = new Date().toLocaleTimeString();
}
updateClock();
setInterval(updateClock, 1000);

</script>
