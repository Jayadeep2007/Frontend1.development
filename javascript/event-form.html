<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Events | Practical Programs</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.demo-form { display:grid; gap:14px; margin-top:18px; }
.demo-form input, .demo-form textarea, .demo-form select { width:100%; padding:10px; margin-top:6px; box-sizing:border-box; }
.demo-form button, button { padding:10px 16px; cursor:pointer; }
.output-box { margin-top:18px; padding:14px; white-space:pre-wrap; }
table { width:100%; border-collapse:collapse; margin-top:15px; }
th, td { border:1px solid #ccc; padding:10px; text-align:left; }
img.demo-img { max-width:100%; border-radius:10px; }
.box { padding:15px; border:1px solid #ddd; margin:10px 0; border-radius:8px; }
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="../index.html"><span class="brand-dot">JR</span>Jayadeep</a>
  <nav class="crumbs">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
  </nav>
</header>
<main>
  <h1 class="page-title">Form Events</h1>
  <p class="subtitle">Demonstrates submit, change, focus and blur events.</p>
  <div class="program-box">

<form id="form" class="demo-form" onsubmit="return false;">
<label>Name <input id="name"></label>
<label>Course <select id="course"><option>CDS</option><option>CSE</option></select></label>
<button type="submit">Submit</button>
</form>
<div id="out" class="output-box"></div>

  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>

const form = document.getElementById("form");
const nameInput = document.getElementById("name");
const course = document.getElementById("course");
const out = document.getElementById("out");
form.addEventListener("submit", e => out.textContent = "Submit event fired");
course.addEventListener("change", () => out.textContent = "Change event: " + course.value);
nameInput.addEventListener("focus", () => out.textContent = "Focus event");
nameInput.addEventListener("blur", () => out.textContent = "Blur event");

</script>
</body>
</html>
