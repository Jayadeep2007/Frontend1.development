<main>
  <h1 class="page-title">History Object</h1>
  <p class="subtitle">Demonstrates browser history navigation methods.</p>
  <div class="program-box">

<button onclick="goBack()">Go Back</button>
<button onclick="goForward()">Go Forward</button>
<div id="out" class="output-box">history.length = 0</div>

  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>

document.getElementById("out").textContent = "History entries: " + history.length;
function goBack() { history.back(); }
function goForward() { history.forward(); }

</script>
