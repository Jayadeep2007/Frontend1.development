<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dependent Country State City Dropdown | Practical Programs</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.demo-form { display:grid; gap:14px; margin-top:18px; }
.demo-form input, .demo-form textarea, .demo-form select { width:100%; padding:10px; margin-top:6px; box-sizing:border-box; }
.demo-form button, button { padding:10px 16px; cursor:pointer; }
.output-box { margin-top:18px; padding:14px; white-space:pre-wrap; }
table { width:100%; border-collapse:collapse; margin-top:15px; }
th, td { border:1px solid #ccc; padding:10px; text-align:left; }
img.demo-img { max-width:100%; border-radius:10px; }
.box { padding:15px; border:1px solid #ddd; margin:10px 0; border-radius:8px; }
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="../index.html"><span class="brand-dot">JR</span>Jayadeep</a>
  <nav class="crumbs">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
  </nav>
</header>
<main>
  <h1 class="page-title">Dependent Country State City Dropdown</h1>
  <p class="subtitle">Updates State and City options based on previous selections.</p>
  <div class="program-box">

<select id="country" onchange="loadStates()">
<option value="">Select Country</option><option>India</option><option>USA</option>
</select>
<select id="state" onchange="loadCities()"><option value="">Select State</option></select>
<select id="city"><option value="">Select City</option></select>

  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>

const data = {
  India: { "Tamil Nadu": ["Chennai", "Coimbatore", "Madurai"], "Karnataka": ["Bengaluru", "Mysuru"] },
  USA: { "California": ["Los Angeles", "San Diego"], "Texas": ["Dallas", "Austin"] }
};
function loadStates() {
  const country = document.getElementById("country").value;
  const state = document.getElementById("state");
  state.innerHTML = '<option value="">Select State</option>';
  document.getElementById("city").innerHTML = '<option value="">Select City</option>';
  if (data[country]) Object.keys(data[country]).forEach(s => state.add(new Option(s, s)));
}
function loadCities() {
  const country = document.getElementById("country").value;
  const state = document.getElementById("state").value;
  const city = document.getElementById("city");
  city.innerHTML = '<option value="">Select City</option>';
  if (data[country] && data[country][state])
    data[country][state].forEach(c => city.add(new Option(c, c)));
}

</script>
</body>
</html>
