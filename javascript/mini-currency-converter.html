<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Currency Converter Using an API | Practical Programs</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.demo-form { display:grid; gap:14px; margin-top:18px; }
.demo-form input, .demo-form textarea, .demo-form select { width:100%; padding:10px; margin-top:6px; box-sizing:border-box; }
.demo-form button, button { padding:10px 16px; cursor:pointer; }
.output-box { margin-top:18px; padding:14px; white-space:pre-wrap; }
table { width:100%; border-collapse:collapse; margin-top:15px; }
th, td { border:1px solid #ccc; padding:10px; text-align:left; }
img.demo-img { max-width:100%; border-radius:10px; }
.box { padding:15px; border:1px solid #ddd; margin:10px 0; border-radius:8px; }
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="../index.html"><span class="brand-dot">JR</span>Jayadeep</a>
  <nav class="crumbs">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
  </nav>
</header>
<main>
  <h1 class="page-title">Currency Converter Using an API</h1>
  <p class="subtitle">Converts currencies using a public exchange-rate API.</p>
  <div class="program-box">

<input id="amount" type="number" value="1">
<input id="from" value="USD" placeholder="From">
<input id="to" value="INR" placeholder="To">
<button onclick="convert()">Convert</button>
<div id="out" class="output-box"></div>

  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>

async function convert() {
  const amount = Number(document.getElementById("amount").value);
  const from = document.getElementById("from").value.toUpperCase();
  const to = document.getElementById("to").value.toUpperCase();
  const out = document.getElementById("out");
  out.textContent = "Loading...";
  try {
    const response = await fetch("https://open.er-api.com/v6/latest/" + encodeURIComponent(from));
    const data = await response.json();
    const rate = data.rates[to];
    if (!rate) throw new Error();
    out.textContent = amount + " " + from + " = " + (amount * rate).toFixed(2) + " " + to;
  } catch {
    out.textContent = "Unable to convert. Check currency codes.";
  }
}

</script>
</body>
</html>
