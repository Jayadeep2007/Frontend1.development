<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Application | Practical Programs</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.demo-form { display:grid; gap:14px; margin-top:18px; }
.demo-form input, .demo-form textarea, .demo-form select { width:100%; padding:10px; margin-top:6px; box-sizing:border-box; }
.demo-form button, button { padding:10px 16px; cursor:pointer; }
.output-box { margin-top:18px; padding:14px; white-space:pre-wrap; }
table { width:100%; border-collapse:collapse; margin-top:15px; }
th, td { border:1px solid #ccc; padding:10px; text-align:left; }
img.demo-img { max-width:100%; border-radius:10px; }
.box { padding:15px; border:1px solid #ddd; margin:10px 0; border-radius:8px; }
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="../index.html"><span class="brand-dot">JR</span>Jayadeep</a>
  <nav class="crumbs">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
  </nav>
</header>
<main>
  <h1 class="page-title">Quiz Application</h1>
  <p class="subtitle">A small multiple-choice quiz.</p>
  <div class="program-box">

<div id="quiz"></div>
<button onclick="nextQuestion()">Next</button>
<div id="out" class="output-box"></div>

  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>

const questions = [
  {q:"Which language runs in a browser?", a:["Python","JavaScript","C"], correct:"JavaScript"},
  {q:"Which method selects an element by ID?", a:["getElementById()","getClass()","selectId()"], correct:"getElementById()"},
  {q:"Which storage persists after closing the browser?", a:["sessionStorage","localStorage","tempStorage"], correct:"localStorage"}
];
let qi = 0, score = 0;
function render() {
  const item = questions[qi];
  document.getElementById("quiz").innerHTML =
    "<h3>" + item.q + "</h3>" +
    item.a.map(x => `<label><input type="radio" name="answer" value="${x}"> ${x}</label><br>`).join("");
}
function nextQuestion() {
  const selected = document.querySelector('input[name="answer"]:checked');
  if (selected && selected.value === questions[qi].correct) score++;
  qi++;
  if (qi < questions.length) render();
  else {
    document.getElementById("quiz").textContent = "Quiz completed.";
    document.getElementById("out").textContent = "Score: " + score + "/" + questions.length;
  }
}
render();

</script>
</body>
</html>
